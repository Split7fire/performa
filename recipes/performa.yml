---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: performa
# description will be included in the image's metadata
description: A performant spin with the KDE desktop. Base image

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  # Install Linux kernel driver for Xbox One and Xbox Series X|S accessories
  - type: akmods
    install:
      - xone


  # Install system packages
  - type: dnf
    install:
      packages:
      # Utilities
      - clinfo
      - evtest
      - fastfetch
      - foo2zjs
      - git-credential-libsecret
      - google-noto-sans-cham-fonts
      - google-noto-sans-linear-a-fonts
      - google-noto-sans-linear-b-fonts
      - libxcrypt-compat
      - lm_sensors
      - oddjob-mkhomedir
      - powertop
      - setools-console
      # KDE Plasma
      - plasma-desktop
      - plasma-login-manager
      - kcm-plasmalogin
      - plasma-nm
      - konsole
      - dolphin

  - type: systemd
    system:
      enabled:
        - plasmalogin.service
    

  # Install Tailscale
  - type: dnf
    repos:
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      keys:
        - https://pkgs.tailscale.com/stable/fedora/repo.gpg
    install:
      packages:
        - tailscale

  - type: systemd
    system:
      enable:
        - tailscaled.service


  # Disable NetworkManager Wait Online
  - type: systemd
    system:
      disabled:
        - NetworkManager-wait-online.service


  # Install sched_ext
  - type: dnf
    repos:
      copr:
        - bieszczaders/kernel-cachyos-addons
    install:
      packages:
        - scx-scheds
        - scx-tools
        - scx-manager

  # Install Brew
  - type: brew
    brew-analytics: false # disable telemetry

  - type: default-flatpaks
    configurations:
      - notify: false # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
          - org.libreoffice.LibreOffice
      - scope: user # Also add Flathub user repo, but no user packages


  - type: signing # this sets up the proper policy & signing files for signed images to work fully