---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: performa
# description will be included in the image's metadata
description: A performant spin with the COSMIC desktop. Base image

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  # Disable RPM signature verification for locally compiled kmod packages
  - type: script
    snippets:
      - "echo '%_pkgverify_level none' > /etc/rpm/macros.verify"

  # Install Advanced Linux Driver for Xbox One Wireless Gamepad
  - type: akmods
    install:
      - xpadneo

  # Restore strict RPM signature verification
  - type: script
    snippets:
      - "rm -f /etc/rpm/macros.verify"


  # Install system packages
  - type: dnf
    install:
      packages:
      # Utilities
      - clinfo
      - evtest
      - fastfetch
      - foo2zjs
      - git-credential-libsecret
      - google-noto-sans-cham-fonts
      - google-noto-sans-linear-a-fonts
      - google-noto-sans-linear-b-fonts
      - libxcrypt-compat
      - lm_sensors
      - oddjob-mkhomedir
      - powertop
      - setools-console
      # COSMIC Desktop (https://forge.fedoraproject.org/atomic-desktops/config/src/branch/main/packages/cosmic-atomic.yaml)
      # - ark
      - cosmic-edit
      - cosmic-files
      - cosmic-initial-setup
      # - cosmic-player
      - cosmic-session
      - cosmic-store
      - cosmic-term
      - flatpak
      - gnome-disk-utility
      # - gnome-system-monitor
      - mesa-dri-drivers
      - mesa-vulkan-drivers
      - pam_oo7
      - plymouth-system-theme
      - system-config-printer

  - type: systemd
    system:
      enabled:
        - cosmic-greeter.service
        
    
  # Install Tailscale
  - type: dnf
    repos:
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      keys:
        - https://pkgs.tailscale.com/stable/fedora/repo.gpg
    install:
      packages:
        - tailscale

  - type: systemd
    system:
      enabled:
        - tailscaled.service


  # Disable NetworkManager Wait Online
  - type: systemd
    system:
      disabled:
        - NetworkManager-wait-online.service


  # Install sched_ext
  - type: dnf
    repos:
      copr:
        - bieszczaders/kernel-cachyos-addons
    install:
      packages:
        - scx-scheds
        - scx-tools
        - scx-manager
        

  # Install Brew
  - type: brew
    brew-analytics: false # disable telemetry

  - type: default-flatpaks
    configurations:
      - notify: false # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
          - io.missioncenter.MissionCenter
          - com.github.tchx84.Flatseal
          - io.github.flattool.Ignition
          - io.mpv.Mpv
          - org.libreoffice.LibreOffice
      # - scope: user # Also add Flathub user repo, but no user packages


  - type: signing # this sets up the proper policy & signing files for signed images to work fully